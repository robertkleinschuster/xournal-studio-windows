name: Build

# The integration build: agents push to main in bursts; CI builds the newest commit, runs the unit tests and uploads the
# staged app (artifact app-<sha>: XournalStudio.exe, pdfium.dll, licenses\ - what install.ps1 installs), which
# `install.ps1 -FromCi` and `UiTests\Run-AppTest.ps1 -FromCi` take instead of a local build.
# - Batching: a newer push to the same branch cancels the running build (concurrency); tags are never cancelled.
# - Docs-only pushes build nothing (paths-ignore).
# - Third-party code comes from the dependency cache (cmake/DependencyCache.cmake), the own code through ccache; both
#   are kept with actions/cache. build.ps1 builds with Ninja.
# - Failures: the failing tests (names and output) and compiler errors are listed in the job summary (gh run view).
# A tag v* also zips the staged app, builds the installer (Inno Setup) and publishes the latest GitHub release (the only job that may write).
on:
  push:
    branches: [main]
    tags: ['v*']
    paths-ignore: ['**.md', 'docs/**', 'examples/**/*.png', 'LICENSE*', '.gitignore', '.gitattributes']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: ${{ github.ref_type != 'tag' }}

jobs:
  build:
    runs-on: windows-2025-vs2026
    timeout-minutes: 25 # about twice a cold run (third-party code and ccache empty)
    env:
      # Windows on the runner has only the en-US handwriting recognizer; the search test writes German words.
      XOURNAL_TEST_EXCLUDE: '^Search\.HandwritingIsRecognisedAndCached$'
      # Main and tags build and stage the committed state as install.ps1 does, in a short path (MSBuild's file
      # tracker fails beyond MAX_PATH); a dispatch on another branch only builds and tests.
      STAGE: ${{ github.ref == 'refs/heads/main' || github.ref_type == 'tag' }}
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: true

      # The runner's %TEMP% is an 8.3 short path (C:\Users\RUNNER~1\...), which the git tests' expected paths do not
      # match (libgit2 reports the long path); RUNNER_TEMP has long names only.
      - name: Temp folder with long names, dependency cache key
        id: deps
        shell: pwsh
        run: |
          "TEMP=$env:RUNNER_TEMP" >> $env:GITHUB_ENV
          "TMP=$env:RUNNER_TEMP" >> $env:GITHUB_ENV
          "XOURNAL_DEPS_CACHE=$env:RUNNER_TEMP\xs-deps" >> $env:GITHUB_ENV
          "CCACHE_DIR=$env:RUNNER_TEMP\ccache" >> $env:GITHUB_ENV
          "CCACHE_MAXSIZE=2G" >> $env:GITHUB_ENV
          "XOURNAL_JOB_START=$((Get-Date).ToUniversalTime().ToString('o'))" >> $env:GITHUB_ENV
          $vs = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -property installationPath
          if (-not $vs) { throw 'Visual Studio not found (vswhere)' }
          $msvc = (Get-Content "$vs\VC\Auxiliary\Build\Microsoft.VCToolsVersion.default.txt").Trim()
          "msvc=$msvc" >> $env:GITHUB_OUTPUT

      # The cache's folder names carry their own keys (pin, recipe, toolchain): a restored folder is only used when it
      # matches, so a partial hit (restore-keys: same toolset, other pins) reuses the unchanged dependencies. The hosted
      # image pool has more than one MSVC version (seen: 14.51 and 14.52), so each version's caches warm up once.
      - name: Restore the dependency cache
        id: deps-restore
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}\xs-deps
          key: xs-deps-${{ runner.os }}-msvc${{ steps.deps.outputs.msvc }}-${{ hashFiles('CMakeLists.txt', 'cmake/**', 'pdf/Dependencies.cmake', 'services/git/Dependencies.cmake', 'pdftext/CMakeLists.txt', 'import/CMakeLists.txt') }}
          restore-keys: xs-deps-${{ runner.os }}-msvc${{ steps.deps.outputs.msvc }}-

      # ccache's directory: per MSVC version and branch (a new key per run - caches are immutable), falling back to
      # main's.
      - name: Restore the compiler cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}\ccache
          key: ccache-${{ runner.os }}-msvc${{ steps.deps.outputs.msvc }}-${{ github.ref_name }}-${{ github.run_id }}
          restore-keys: |
            ccache-${{ runner.os }}-msvc${{ steps.deps.outputs.msvc }}-${{ github.ref_name }}-
            ccache-${{ runner.os }}-msvc${{ steps.deps.outputs.msvc }}-main-

      - name: Build and unit tests
        if: env.STAGE != 'true'
        shell: pwsh
        run: .\build.ps1

      # install.ps1 -SkipInstall: HEAD built in its own worktree, unit tests, staged in .local-build\install-stage.
      - name: Build, unit tests and stage
        if: env.STAGE == 'true'
        shell: pwsh
        run: .\install.ps1 -SkipInstall -SourceDir (Join-Path $env:RUNNER_TEMP 's')

      # Failed tests (CTest's JUnit file: names and output) and compiler errors (build.ps1's build log) for gh run view.
      - name: Summary
        if: always()
        shell: pwsh
        run: |
          $summary = @()
          $roots = @('.local-build', (Join-Path $env:RUNNER_TEMP 's\.local-build'))
          foreach ($root in $roots) {
              $log = Join-Path $root 'build-output.log'
              if (Test-Path $log) {
                  $errors = @(Select-String -Path $log -Pattern ': (fatal )?error [A-Z]+\d+' | ForEach-Object { $_.Line.Trim() } | Select-Object -Unique -First 30)
                  if ($errors) { $summary += '### Build errors'; $summary += '```'; $summary += $errors; $summary += '```' }
              }
              $junit = Join-Path $root 'ctest-junit.xml'
              if (Test-Path $junit) {
                  [xml]$xml = Get-Content -Raw $junit
                  $cases = @($xml.testsuite.testcase)
                  $failed = @($cases | Where-Object { $_.status -eq 'fail' -or $_.failure })
                  $summary += "### Unit tests: $($cases.Count - $failed.Count) of $($cases.Count) passed"
                  foreach ($case in $failed) {
                      $summary += "- **$($case.name)**"
                      $out = "$($case.'system-out')".Trim()
                      if ($out) { $summary += '```'; $summary += ($out -split "`n" | Select-Object -Last 40); $summary += '```' }
                  }
              }
          }
          if (-not $summary) { $summary = @('No build log or test results (the job stopped before the build; see its log).') }
          $summary -join "`n" >> $env:GITHUB_STEP_SUMMARY

      - name: Keep the staged app
        if: env.STAGE == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: app-${{ github.sha }}
          path: .local-build/install-stage
          retention-days: 5
          if-no-files-found: error

      # Pushes often cancel a running build (concurrency), so the caches are also saved from cancelled and failed runs -
      # but the dependency cache only when it is complete: the configure builds every dependency, and a finished
      # configure leaves build.ninja (an incomplete cache under the exact key would never be replaced). Only the
      # folders this run used are kept (each configure touches its folders' last-used file); downloads are needed only
      # to build.
      - name: Save the dependency cache
        id: deps-prune
        if: always() && steps.deps-restore.outcome == 'success' && steps.deps-restore.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          $trees = @('.local-build\cmake', (Join-Path $env:RUNNER_TEMP 's\.local-build\cmake'))
          if (-not ($trees | Where-Object { Test-Path (Join-Path $_ 'build.ninja') })) {
              'the configure did not finish: the dependency cache may be incomplete and is not saved'; exit 0
          }
          $root = $env:XOURNAL_DEPS_CACHE
          $start = [DateTime]::Parse($env:XOURNAL_JOB_START).ToUniversalTime()
          $downloads = Join-Path $root 'downloads'
          if (Test-Path $downloads) { Remove-Item -Recurse -Force $downloads }
          foreach ($dir in Get-ChildItem $root -Directory) {
              $stamp = Join-Path $dir.FullName 'last-used'
              if (-not (Test-Path $stamp) -or (Get-Item $stamp).LastWriteTimeUtc -lt $start) {
                  "not used by this run, left out: $($dir.Name)"
                  Remove-Item -Recurse -Force $dir.FullName
              }
          }
          Get-ChildItem $root -Directory | ForEach-Object { "kept: $($_.Name)" }
          'complete=true' >> $env:GITHUB_OUTPUT
      - name: Save the dependency cache (upload)
        if: always() && steps.deps-prune.outputs.complete == 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}\xs-deps
          key: ${{ steps.deps-restore.outputs.cache-primary-key }}

      # Every result ccache stored is valid on its own: kept also from cancelled and failed runs.
      - name: Save the compiler cache
        if: always() && steps.deps.outcome == 'success'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}\ccache
          key: ccache-${{ runner.os }}-msvc${{ steps.deps.outputs.msvc }}-${{ github.ref_name }}-${{ github.run_id }}

      - name: Release files (zip, installer)
        if: github.ref_type == 'tag'
        shell: pwsh
        run: |
          # Inno Setup 6 (ISCC.exe, a native compiler) unless the image has it.
          if (-not (Get-Command ISCC.exe -ErrorAction SilentlyContinue) -and
              -not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) {
              choco install innosetup --version=6.7.3 -y --no-progress
              if ($LASTEXITCODE) { throw "choco install innosetup failed ($LASTEXITCODE)" }
          }
          $version = $env:GITHUB_REF_NAME.TrimStart('v')
          $stage = '.local-build\install-stage'
          Copy-Item THIRD-PARTY.md $stage
          @"
          Xournal Studio (Win32) $version - Windows 11 x64

          Installed with the setup (XournalStudio-Win32-$version-x64-setup.exe): start it from the Start menu entry
          "Xournal Studio (Win32)"; uninstall in Apps & Features.
          Portable (the zip): unzip this folder anywhere and start XournalStudio.exe. Nothing is registered and nothing
          else is needed (static C++ runtime); delete the folder to remove it.
          The files are unsigned: Windows SmartScreen warns on the first start ("Weitere Informationen" -> "Trotzdem
          ausfuehren"). Settings, recovery copies and logs: %LOCALAPPDATA%\XournalStudioForWindows (kept on uninstall).
          Third-party licenses: THIRD-PARTY.md and licenses\.
          "@ | Set-Content -Encoding utf8 (Join-Path $stage 'README.txt')
          $zip = "XournalStudio-Win32-$version-x64.zip"
          Compress-Archive -Path "$stage\*" -DestinationPath $zip
          .\installer\Build-Installer.ps1 -Version $version -Stage $stage -Out "XournalStudio-Win32-$version-x64-setup.exe"
          $hash = (Get-FileHash (Join-Path $stage 'XournalStudio.exe') -Algorithm SHA256).Hash
          "XournalStudio.exe SHA-256: $hash"
          $hash | Set-Content -Encoding ascii exe.sha256

      - name: Keep the release files
        if: github.ref_type == 'tag'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release
          path: |
            XournalStudio-Win32-*-x64-setup.exe
            XournalStudio-Win32-*-x64.zip
            exe.sha256
          if-no-files-found: error

  release:
    needs: build
    if: github.ref_type == 'tag'
    runs-on: windows-2025
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - name: Get the zip
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release

      - name: Publish latest GitHub release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $version = $env:GITHUB_REF_NAME.TrimStart('v')
          $hash = (Get-Content exe.sha256).Trim()
          $notes = @"
          Xournal Studio for Windows 11 (x64) is a native C++/Win32 pen note app that reads
          and writes Xournal++ ``.xopp`` files in the upstream format (nothing it does not understand is lost).

          - Windows ink with the pen (pressure, eraser end, barrel button = lasso); finger and touchpad pan and zoom, the
            mouse selects - only the pen writes.
          - Pen and highlighter presets, exact or whole-stroke eraser, selection (lasso/rectangle) to move, scale, copy
            and delete across pages, shapes and shape recognition, the Windows ruler, a text tool, undo/redo.
          - PDF backgrounds, all Xournal++ backgrounds, pictures and texts; open a PDF as a new document; PDF export;
            pages inserted, moved and deleted, also from another PDF or document; the PDF's outline and links.
          - Search (Ctrl+F) over the PDF's text, the file's texts and handwriting.
          - Side pane: project folder explorer with git colors and sync, todo.txt tasks, page thumbnails.
          - Saving only by choice, with recovery copies of unsaved changes; iPad (PencilKit) markup import.

          **Install:** ``XournalStudio-Win32-$version-x64-setup.exe`` - per user, no admin rights: installs to
          ``%LOCALAPPDATA%\Programs\Xournal Studio (Win32)`` with a Start menu entry "Xournal Studio (Win32)" and an entry in
          Apps & Features (uninstall there; settings, recovery copies and documents stay). A newer setup replaces an older installation.
          Portable alternative: unzip ``XournalStudio-Win32-$version-x64.zip`` anywhere and start ``XournalStudio.exe``.

          The files are not signed (no code-signing certificate yet): Windows SmartScreen warns on the first start - choose
          "Weitere Informationen" -> "Trotzdem ausführen" ("More info" -> "Run anyway").

          XournalStudio.exe SHA-256: ``$hash``

          The earlier C#/WinUI version stays available at the tag ``csharp-final`` and the release v0.1.0.
          "@
          gh release create $env:GITHUB_REF_NAME "XournalStudio-Win32-$version-x64-setup.exe" "XournalStudio-Win32-$version-x64.zip" --repo $env:GITHUB_REPOSITORY --title "Xournal Studio (Win32) $version" --notes $notes --generate-notes --verify-tag --latest
