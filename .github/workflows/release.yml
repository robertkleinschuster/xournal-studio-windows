name: Release

# A tag v* builds, tests and publishes a GitHub release (marked pre-release) with the self-contained app as a zip.
# Started by hand, it only builds and keeps the zip as a workflow artifact.
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-2025
    timeout-minutes: 60
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
      DOTNET_NOLOGO: '1'
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Version
        id: version
        shell: pwsh
        run: |
          $version = if ($env:GITHUB_REF_TYPE -eq 'tag') { $env:GITHUB_REF_NAME.TrimStart('v') } else { "0.0.0-ci.$env:GITHUB_RUN_NUMBER" }
          "version=$version" >> $env:GITHUB_OUTPUT
          "Version $version"

      # The WinUI runtime with the ink fix (pinned URL and SHA-256, see the script and CLAUDE.md).
      - name: Fetch WinUI runtime
        shell: pwsh
        run: .\tools\Get-WinUIRuntime.ps1

      - name: Unit tests
        shell: pwsh
        run: |
          dotnet test XournalStudio.Tests -nologo -v q
          if ($LASTEXITCODE -ne 0) { throw 'Tests failed.' }

      - name: Publish
        shell: pwsh
        run: |
          $version = '${{ steps.version.outputs.version }}'
          dotnet publish XournalStudio\XournalStudio.csproj -c Release -o out\XournalStudio -nologo -v q -p:Version=$version
          if ($LASTEXITCODE -ne 0) { throw 'Publish failed.' }
          $dll = Get-Item out\XournalStudio\Microsoft.ui.xaml.dll
          "Microsoft.UI.Xaml.dll: $($dll.VersionInfo.FileVersion), $($dll.Length) bytes"
          if ($dll.VersionInfo.FileVersion -notmatch '70a93db5') { throw 'The published app does not carry the fork WinUI runtime.' }
          Compress-Archive -Path out\XournalStudio -DestinationPath "out\XournalStudio-$version-win-x64.zip"

      - name: Keep the zip
        uses: actions/upload-artifact@v4
        with:
          name: XournalStudio-${{ steps.version.outputs.version }}-win-x64
          path: out/XournalStudio-${{ steps.version.outputs.version }}-win-x64.zip
          if-no-files-found: error

      - name: GitHub release
        if: github.ref_type == 'tag'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $version = '${{ steps.version.outputs.version }}'
          $notes = @"
          Xournal Studio for Windows $version – Windows 11 x64, self-contained (no installation of .NET or the Windows App SDK needed).

          Unzip and start ``XournalStudio\XournalStudio.exe``.

          Built against the official Microsoft.WindowsAppSDK.WinUI 2.6.6-experimental with a WinUI runtime that carries the
          not yet merged ink fix microsoft/microsoft-ui-xaml#12292 (robertkleinschuster/microsoft-ui-xaml release
          winui-ink-fix-70a93db5). Pre-release.
          "@
          gh release create $env:GITHUB_REF_NAME "out\XournalStudio-$version-win-x64.zip" --title "Xournal Studio for Windows $version" --notes $notes --prerelease
